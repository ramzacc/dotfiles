# Catppuccin Mocha palette: https://github.com/catppuccin/dunst
# Compact cards with a muted border and blue accents.
[global]
    width = 340
    height = (0, 240)
    origin = top-right
    offset = (16, 48)
    notification_limit = 4
    padding = 16
    horizontal_padding = 18
    text_icon_padding = 12
    gap_size = 10
    frame_width = 1
    frame_color = "#45475a"
    corner_radius = 10
    separator_color = frame
    font = Noto Sans 10
    format = "<b>%s</b>\n%b"
    alignment = left
    vertical_alignment = center
    icon_position = left
    min_icon_size = 32
    max_icon_size = 32
    icon_corner_radius = 6
    highlight = "#89b4fa"
    progress_bar_height = 6
    progress_bar_frame_width = 0
    progress_bar_corner_radius = 3

[urgency_low]
    background = "#1e1e2e"
    foreground = "#a6adc8"
    frame_color = "#313244"

[urgency_normal]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    frame_color = "#45475a"

[urgency_critical]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    frame_color = "#fab387"
